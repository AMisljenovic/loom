name: Feature request
description: Suggest a new capability or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case, not just the proposed solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: Which layer would this affect?
      multiple: true
      options:
        - Extension host (TypeScript)
        - Webview UI (React)
        - Agent (Go)
        - Build / packaging
        - Documentation
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
